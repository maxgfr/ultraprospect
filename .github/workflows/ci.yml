name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by engine-repin.yml — see the note in release.yml.
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the dev-toolchain floor (vitest 4 needs >=20.19); 24 is current.
        # The published bundle's Node 18 floor is covered by runtime-node-floor.
        node-version: [20, 24]
    name: build-test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build is reproducible (committed bundle up to date)
        run: pnpm run check:build

      - name: Test
        run: pnpm test

      # Coverage ratchet — one Node version is enough (the suite is deterministic).
      - name: Coverage thresholds
        if: matrix.node-version == 24
        run: pnpm run test:coverage

      - name: Smoke-run the committed bundle (offline, recorded sweep)
        run: pnpm run demo

      - name: Assert the run was produced
        run: |
          test -f /tmp/ultraprospect-demo/runs/*/manifest.json
          test -f /tmp/ultraprospect-demo/runs/*/places.json

      - name: Pipeline evals (offline, deterministic)
        run: pnpm run eval

  install-bundle:
    runs-on: ubuntu-latest
    name: install-bundle (skill installs whole, not just SKILL.md)
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the embedded bundle
        run: pnpm run build
      - name: Verify the install-bundle shape (no root SKILL.md, engine in sync)
        run: pnpm run verify:bundle
      - name: End-to-end — `skills add` bundles the engine + references, not SKILL.md alone
        run: |
          WORK="$(mktemp -d)"
          cd "$WORK"
          npx --yes skills add "$GITHUB_WORKSPACE" --skill ultraprospect --agent claude-code --copy -y
          DIR=.claude/skills/ultraprospect
          test -f "$DIR/SKILL.md"                    || { echo "::error::SKILL.md not installed"; exit 1; }
          test -f "$DIR/scripts/ultraprospect.mjs"   || { echo "::error::engine not bundled — skills add dropped scripts/"; exit 1; }
          test -d "$DIR/references"                  || { echo "::error::references/ not bundled"; exit 1; }
          node "$DIR/scripts/ultraprospect.mjs" --help > /dev/null || { echo "::error::installed engine does not run"; exit 1; }
          echo "install-bundle: skill installed whole and the engine runs."

  # The shipped scripts/ultraprospect.mjs is a dependency-free bundle declaring
  # engines.node ">=18", but the dev toolchain (vitest 4) needs Node >=20.19 — so
  # build-test above cannot prove the floor. This job runs ONLY the committed
  # bundle on Node 18, with no install, to guarantee the published ">=18" promise
  # holds. A Node 20+ API sneaking into src/ would build green on Node 24 and
  # break for real users on 18; this catches that.
  runtime-node-floor:
    runs-on: ubuntu-latest
    name: runtime (Node 18 floor, zero-dep bundle)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: An offline sweep runs on Node 18
        run: |
          node scripts/ultraprospect.mjs scan --fixture assets/fixtures/vincennes --out "$RUNNER_TEMP/u18"
          test -f "$RUNNER_TEMP"/u18/runs/*/places.json
          test -f "$RUNNER_TEMP"/u18/runs/*/MATCH.todo.json

      - name: --help runs on Node 18
        run: node scripts/ultraprospect.mjs --help > /dev/null
